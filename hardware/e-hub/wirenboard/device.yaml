# MAP6S Device Configuration

esphome:
  min_version: 2025.7.0
  devices:
    - id: ${id}_device
      name: ${name}
      area_id: ${area_id}

modbus_controller:
  - id: ${id}_controller
    address: ${address}
    setup_priority: -10
    continuous: true
    update_interval: ${update_interval}
  - id: ${id}_settings_controller
    address: ${address}
    setup_priority: -10
    update_interval: never

packages:
  update: !include
    file: "update/${family_id}.yaml"
    vars:
      id: ${id}
      signature_id: ${signature_id}

  device: !include
    file: "${family_id}/device.yaml"
    vars:
      id: ${id}

wifi:
  on_connect:
    - script.execute: polling_loop

script:
  - id: polling_loop
    mode: restart
    then:
      - while:
          condition:
            wifi.connected:
          then:
            - delay: 1h
            - component.update: ${id}_settings_controller
